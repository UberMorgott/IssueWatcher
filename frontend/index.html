<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable as an app window; credentials: every path except /auth needs the session cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <title>IssueWatcher</title>
    <script>
      // Apply the last theme mode before first paint (no dark→light flash); the
      // server-side settings take over once the app loads.
      try {
        var m = localStorage.getItem('iw.theme')
        if (m === 'light' || (m === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches))
          document.documentElement.classList.remove('dark')
        // Last palette / custom colours / font (lib/appearance.ts writes them).
        var p = JSON.parse(localStorage.getItem('iw.paint') || 'null')
        if (p && p.tokens && (m !== 'system' || p.dark === document.documentElement.classList.contains('dark'))) {
          var s = document.documentElement.style
          for (var k in p.tokens) if (k.indexOf('--iw-') === 0) s.setProperty(k, p.tokens[k])
          if (p.font) s.setProperty('--iw-font', p.font)
          if (p.fs) s.setProperty('--iw-fs', String(p.fs))
        }
      } catch (e) {
        /* storage blocked: keep dark */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
